spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# TrueTrace Security Sync Token for Microservice Authentication
truetrace.security.sync-token=${TRUETRACE_SECURITY_SYNC_TOKEN}

# Disable Kafka in test profile (no broker needed for unit tests)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
truetrace.kyc.required-for-transfers=false
